
name: Coleta diaria - Pokemon Data Pipeline

on:
  schedule:
    # 17h30 em Sao Paulo (20h30 UTC)
    - cron: "30 17 * * *"
      timezone: "America/Sao_Paulo"

  # Permite executar manualmente pelo GitHub
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pokemon-data-coleta-diaria
  cancel-in-progress: false

jobs:
  coleta:
    name: Coleta TCGCSV e Banco Central
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # RustFS
      S3_ENDPOINT: https://lake-aulas-mackenzie.afonsolelis.tech
      S3_BUCKET: tcg
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}

      # Colecao MEG
      TCG_GROUP_ID: "24380"
      TCG_USER_AGENT: colecao-meg/1.0

      TCG_COLLECTION_NAME: "ME01: Mega Evolution"
      TCG_COLLECTION_SIGLA: MEG
      TCG_COLLECTION_RELEASE_DATE: "2025-09-26"

      # Coletor
      REQUEST_TIMEOUT_SECONDS: "30"
      REQUEST_DELAY_SECONDS: "0.15"
      MAX_RETRIES: "5"
      BCB_CDI_LOOKBACK_DAYS: "15"

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validar configuracoes
        shell: bash
        run: |
          if [[ -z "$S3_ACCESS_KEY" || -z "$S3_SECRET_KEY" ]]; then
            echo "::error::Credenciais S3 nao configuradas nos GitHub Secrets."
            exit 1
          fi

          echo "Configuracoes obrigatorias presentes."

      - name: Executar testes unitarios
        run: |
          python -m pytest tests/unidade/ -v

      - name: Executar coleta diaria
        run: |
          python -m scripts.coletar_diario
